name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    # macOS: darwin binaries need an ad-hoc codesign after `bun build --compile`; linux/windows cross-compile here too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:bin
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/*
            install.sh
          generate_release_notes: true
      # npm trusted publishing (OIDC, id-token: write above): no token; provenance is generated automatically.
      # Needs npm >= 11.5.1 and Node >= 22.14, and the trusted publisher configured on npmjs.com for release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm publish --access public
